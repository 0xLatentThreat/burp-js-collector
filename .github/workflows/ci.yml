name: CI - Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Build & Verify on Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Core and Run Stress Benchmark
        run: |
          mkdir -p core/out
          javac --release 17 -encoding UTF-8 -d core/out core/jscollect/core/*.java
          if [ -d "test/scenarios" ]; then
            java -Dfile.encoding=UTF-8 -cp core/out jscollect.core.ScenarioRunner test/scenarios
          fi
          if [ -d "test/fixtures" ]; then
            java -Dfile.encoding=UTF-8 -cp core/out jscollect.core.ScenarioTest test/fixtures
          fi
          java -Dfile.encoding=UTF-8 -cp core/out jscollect.core.StressTest

      - name: Build Burp Extension Fat Jar
        run: |
          gradle fatJar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BurpJsCollector-dev
          path: build/libs/*.jar
